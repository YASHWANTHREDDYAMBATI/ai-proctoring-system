<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Proctoring - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-left">
            <div>
                <i class="fas fa-shield-alt login-logo"></i>
                <h1>AI Proctoring System</h1>
                <p>Secure online examination platform with AI-powered monitoring and performance analytics.</p>
                <ul>
                    <li>✓ Create Examinations</li>
                    <li>✓ Manage Questions</li>
                    <li>✓ View Results</li>
                    <li>✓ AI Analytics Reports</li>
                </ul>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form">
                <h2>Welcome Back</h2>
                <p>Sign in as a student, faculty, or admin.</p>
                <form id="facultyLoginForm">
                    <input type="text" id="email" placeholder="ID (e.g. superadmin / FAC001 / S001)" required>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter Password" required>
                        <i class="fas fa-eye" onclick="togglePassword()"></i>
                    </div>
                    <button type="submit">Login</button>
                </form>
                <p id="message"></p>
            </div>
        </div>
    </div>
    <script src="faculty_login.js"></script>
</body>
</html>
